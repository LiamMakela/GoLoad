services:

  redis:
    image: redis:7-alpine
    container_name: connect4-redis
    restart: unless-stopped

    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru

    mem_limit: 160m
    cpus: 0.25
    pids_limit: 100

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  backend1:
    build:
      context: "../Connect-4/backend"

    restart: unless-stopped

    mem_limit: 160m
    cpus: 0.35
    pids_limit: 100

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    expose:
      - "8000"


  backend2:
    build:
      context: "../Connect-4/backend"

    restart: unless-stopped

    mem_limit: 160m
    cpus: 0.35
    pids_limit: 100

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    expose:
      - "8000"


  goload:
    build:
      context: "."

    container_name: goload
    restart: unless-stopped

    mem_limit: 96m
    cpus: 0.50
    pids_limit: 100

    depends_on:
      - backend1
      - backend2

    expose:
      - "8080"


  frontend:
    build:
      context: "../Connect-4/frontend"
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""

    container_name: connect4-frontend
    restart: unless-stopped

    mem_limit: 64m
    cpus: 0.20
    pids_limit: 50

    depends_on:
      - goload

    expose:
      - "80"


  caddy:
    image: caddy:2-alpine
    container_name: connect4-caddy
    restart: unless-stopped

    mem_limit: 96m
    cpus: 0.30
    pids_limit: 100

    depends_on:
      - frontend
      - goload

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config


volumes:
  redis-data:
  caddy-data:
  caddy-config: